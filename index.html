<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#172033;
    background:radial-gradient(circle at top,#e9e9ff,#f5f7fb 50%);
    transition:.3s;
}

body.dark{
    color:#f5f7ff;
    background:radial-gradient(circle at top,#252044,#0f1117 55%);
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:24px 15px 40px;
}

.header{
    text-align:center;
}

.logo{
    width:66px;
    height:66px;
    margin:auto;
    display:grid;
    place-items:center;
    border-radius:20px;
    font-size:32px;
    color:white;
    background:linear-gradient(135deg,#5b5cf0,#7c3aed);
    box-shadow:0 12px 30px #5b5cf040;
}

h1{
    margin:13px 0 6px;
    font-size:28px;
}

.subtitle{
    color:#718096;
    font-size:14px;
}

.theme-btn{
    margin:14px 0 24px;
    padding:10px 16px;
    border:1px solid #e7eaf0;
    border-radius:12px;
    background:#fff;
    color:#172033;
    font-weight:bold;
    cursor:pointer;
}

body.dark .theme-btn{
    background:#181b24;
    color:#f5f7ff;
    border-color:#2b3040;
}

.control-card{
    padding:16px;
    border:1px solid #e7eaf0;
    border-radius:20px;
    background:#fff;
    box-shadow:0 12px 35px #1e284714;
}

body.dark .control-card,
body.dark .name-card{
    background:#181b24;
    border-color:#2b3040;
}

.label{
    display:block;
    margin-bottom:8px;
    font-size:12px;
    font-weight:bold;
    color:#718096;
}

.control-row{
    display:flex;
    gap:10px;
}

select{
    flex:1;
    min-width:0;
    padding:14px;
    border:1px solid #e7eaf0;
    border-radius:13px;
    background:white;
    color:#172033;
    font-size:15px;
}

body.dark select{
    background:#181b24;
    color:#f5f7ff;
    border-color:#2b3040;
}

.change-btn{
    border:0;
    padding:0 18px;
    border-radius:13px;
    background:linear-gradient(135deg,#5b5cf0,#7c3aed);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.names{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-top:18px;
}

.name-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px;
    border:1px solid #e7eaf0;
    border-radius:17px;
    background:#fff;
    box-shadow:0 7px 22px #1e284710;
    animation:slide .3s ease both;
}

.left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.number{
    width:39px;
    height:39px;
    flex:none;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:#f0f1ff;
    color:#5b5cf0;
    font-weight:bold;
}

body.dark .number{
    background:#252440;
}

.name{
    font-size:16px;
    font-weight:bold;
    word-break:break-word;
}

.country{
    margin-top:4px;
    color:#718096;
    font-size:12px;
}

.copy-btn{
    flex:none;
    border:1px solid #dfe3ff;
    background:#f5f5ff;
    color:#5b5cf0;
    padding:9px 13px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

body.dark .copy-btn{
    background:#20243a;
    border-color:#343a5a;
    color:#aeb3ff;
}

.copy-btn.copied{
    background:#ecfdf3;
    border-color:#bbf7d0;
    color:#16a34a;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#718096;
    font-size:12px;
}

@keyframes slide{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:520px){
    .container{
        padding:18px 12px 30px;
    }

    h1{
        font-size:24px;
    }

    .control-row{
        flex-direction:column;
    }

    .change-btn{
        width:100%;
        padding:13px;
    }
}
</style>
</head>

/* =========================================
   MAKE EACH COUNTRY 500 NAMES
========================================= */

function expandNames(country){

    const list=names[country];

    const first=pools[country].first;
    const last=pools[country].last;

    const used=new Set(list);

    for(let f of first){

        for(let l of last){

            const full=f+" "+l;

            if(!used.has(full)){

                list.push(full);

                used.add(full);

            }

            if(list.length>=500){

                return;

            }

        }

    }

}


/* Expand */

expandNames("South Africa");

function randomFive(array){

    const copy=[...array];

    const result=[];

    while(
        result.length<5 &&
        copy.length>0
    ){

        const index=
            Math.floor(
                Math.random()*copy.length
            );

        result.push(
            copy.splice(index,1)[0]
        );

    }

    return result;

}


/* =========================================
   GENERATE
========================================= */

function generateNames(){

    const selected=
        document.getElementById(
            "country"
        ).value;

    let pool=[];

    let label="";


    if(selected==="all"){

        Object.keys(names).forEach(
            country=>{

                pool.push(
                    ...names[country]
                );

            }
        );

        label="🌍 All 5 Countries";

    }

    else{

        pool=names[selected]||[];

        label=
            labels[selected];

    }


    const container=
        document.getElementById(
            "names"
        );

    container.innerHTML="";


    randomFive(pool).forEach(
        (name,index)=>{

            const card=
                document.createElement(
                    "div"
                );

            card.className=
                "name-card";

            card.style.animationDelay=
                `${index*.06}s`;


            const left=
                document.createElement(
                    "div"
                );

            left.className="left";


            const number=
                document.createElement(
                    "div"
                );

            number.className=
                "number";

            number.textContent=
                index+1;


            const info=
                document.createElement(
                    "div"
                );


            const nameElement=
                document.createElement(
                    "div"
                );

            nameElement.className=
                "name";

            nameElement.textContent=
                name;


            const countryElement=
                document.createElement(
                    "div"
                );

            countryElement.className=
                "country";

            countryElement.textContent=
                label;


            info.append(
                nameElement,
                countryElement
            );


            left.append(
                number,
                info
            );


            const copy=
                document.createElement(
                    "button"
                );

            copy.className=
                "copy-btn";

            copy.textContent=
                "Copy";


            copy.onclick=
                async function(){

                    try{

                        await navigator
                            .clipboard
                            .writeText(name);

                    }

                    catch{

                        const textarea=
                            document.createElement(
                                "textarea"
                            );

                        textarea.value=
                            name;

                        document.body
                            .appendChild(
                                textarea
                            );

                        textarea.select();

                        document.execCommand(
                            "copy"
                        );

                        textarea.remove();

                    }


                    copy.textContent=
                        "✓ Copied";

                    copy.classList.add(
                        "copied"
                    );


                    setTimeout(
                        function(){

                            copy.textContent=
                                "Copy";

                            copy.classList.remove(
                                "copied"
                            );

                        },
                        1200
                    );

                };


            card.append(
                left,
                copy
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================
   DARK / BRIGHT
========================================= */

function toggleTheme(){

    document.body.classList.toggle(
        "dark"
    );


    const dark=
        document.body.classList.contains(
            "dark"
        );


    const button=
        document.getElementById(
            "themeBtn"
        );


    button.textContent=
        dark
        ? "☀️ Bright Mode"
        : "🌙 Dark Mode";


    localStorage.setItem(
        "theme",
        dark
        ? "dark"
        : "bright"
    );

}


/* =========================================
   LOAD THEME
========================================= */

if(
    localStorage.getItem("theme")
    ===
    "dark"
){

    document.body.classList.add(
        "dark"
    );


    document.getElementById(
        "themeBtn"
    ).textContent=
        "☀️ Bright Mode";

}


/* =========================================
   EVENTS
========================================= */

document
    .getElementById("themeBtn")
    .onclick=
    toggleTheme;


document
    .getElementById("changeBtn")
    .onclick=
    generateNames;


document
    .getElementById("country")
    .onchange=
    generateNames;


/* =========================================
   START
========================================= */

generateNames();

</script>

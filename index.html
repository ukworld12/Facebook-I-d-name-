<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Name Generator</title>

<style>
:root{
    --bg:#f5f7fb;
    --card:#fff;
    --text:#172033;
    --muted:#718096;
    --primary:#5b5cf0;
    --primary2:#7c3aed;
    --border:#e7eaf0;
    --success:#16a34a;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at top,
            #e9e9ff 0,
            #f5f7fb 45%,
            #f5f7fb 100%
        );

    transition:
        background .3s,
        color .3s;
}

body.dark{
    --bg:#0f1117;
    --card:#181b24;
    --text:#f5f7ff;
    --muted:#a6adbd;
    --border:#2b3040;

    background:
        radial-gradient(
            circle at top,
            #252044 0,
            #0f1117 50%,
            #0f1117 100%
        );
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:24px 15px 40px;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:24px;
}

.logo{
    width:66px;
    height:66px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;
    font-size:31px;
    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    box-shadow:
        0 12px 30px
        rgba(91,92,240,.25);
}

h1{
    margin:13px 0 6px;
    font-size:28px;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
}

/* THEME */

.theme-btn{
    margin-top:14px;
    padding:10px 16px;

    border:1px solid var(--border);
    border-radius:12px;

    background:var(--card);
    color:var(--text);

    font-size:14px;
    font-weight:bold;
    cursor:pointer;

    transition:.2s;
}

.theme-btn:hover{
    transform:translateY(-1px);
}

/* CONTROL */

.control-card{
    background:rgba(255,255,255,.96);

    border:1px solid var(--border);
    border-radius:20px;

    padding:16px;
    margin-bottom:18px;

    box-shadow:
        0 12px 35px
        rgba(30,40,70,.08);

    transition:.3s;
}

body.dark .control-card{
    background:rgba(24,27,36,.96);
}

.label{
    display:block;
    margin-bottom:8px;

    font-size:12px;
    font-weight:bold;
    color:var(--muted);
}

.control-row{
    display:flex;
    gap:10px;
}

select{
    flex:1;
    min-width:0;

    padding:14px;

    border:1px solid var(--border);
    border-radius:13px;

    background:#fff;
    color:#172033;

    font-size:15px;
    outline:none;
    cursor:pointer;
}

body.dark select{
    background:#181b24;
    color:#fff;
    border-color:#2b3040;
}

select:focus{
    border-color:var(--primary);
}

/* CHANGE BUTTON */

.change-btn{
    border:0;
    padding:0 18px;

    border-radius:13px;

    color:#fff;
    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    box-shadow:
        0 8px 18px
        rgba(91,92,240,.25);

    transition:.15s;
}

.change-btn:active{
    transform:scale(.97);
}

/* NAMES */

.names-list{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.name-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    padding:15px;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:17px;

    box-shadow:
        0 7px 22px
        rgba(30,40,70,.06);

    animation:slideIn .3s ease both;
}

.name-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.number{
    width:39px;
    height:39px;
    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#f0f1ff;
    color:var(--primary);

    font-weight:bold;
}

body.dark .number{
    background:#252440;
}

.name-info{
    min-width:0;
}

.name{
    font-size:16px;
    font-weight:700;
    word-break:break-word;
}

.country{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
}

/* COPY */

.copy-btn{
    flex:none;

    border:1px solid #dfe3ff;

    background:#f5f5ff;
    color:var(--primary);

    padding:9px 13px;

    border-radius:10px;

    font-weight:bold;
    cursor:pointer;

    transition:.2s;
}

body.dark .copy-btn{
    background:#20243a;
    border-color:#343a5a;
    color:#aeb3ff;
}

.copy-btn:hover{
    transform:translateY(-1px);
}

.copy-btn.copied{
    background:#ecfdf3;
    border-color:#bbf7d0;
    color:var(--success);
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:20px;

    color:var(--muted);
    font-size:12px;
}

/* ANIMATION */

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:520px){

    .container{
        padding:18px 12px 30px;
    }

    h1{
        font-size:24px;
    }

    .control-row{
        flex-direction:column;
    }

    .change-btn{
        width:100%;
        padding:13px;
    }

    .name-card{
        padding:13px;
    }

    .copy-btn{
        padding:8px 10px;
    }
}
</style>

/* =====================================================
   RANDOM ITEM
===================================================== */

function randomItem(array){

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* =====================================================
   GET 5 UNIQUE NAMES
===================================================== */

function getFiveUnique(pool){

    const selected = new Set();

    while(
        selected.size < 5 &&
        selected.size < pool.length
    ){

        selected.add(
            randomItem(pool)
        );

    }

    return [...selected];

}


/* =====================================================
   GENERATE
===================================================== */

function generateNames(){

    const type =
        document.getElementById("country").value;

    let pool;
    let label;


    switch(type){

        case "usa":

            pool = usaNames;
            label = "🇺🇸 USA";

            break;


        case "nigeria":

            pool = nigeriaNames;
            label = "🇳🇬 Nigeria";

            break;


        case "india":

            pool = indiaNames;
            label = "🇮🇳 India";

            break;


        case "pakistan":

            pool = pakistanNames;
            label = "🇵🇰 Pakistan";

            break;


        case "southafrica":

            pool = southAfricaNames;
            label = "🇿🇦 South Africa";

            break;


        default:

            pool = allNames;
            label = "🌍 All Categories";

    }


    const selected =
        getFiveUnique(pool);


    const container =
        document.getElementById("names");


    container.innerHTML = "";


    selected.forEach(
        (name,index)=>{

            const card =
                document.createElement("div");

            card.className = "name-card";

            card.style.animationDelay =
                `${index * 0.06}s`;


            card.innerHTML = `

                <div class="name-left">

                    <div class="number">
                        ${index + 1}
                    </div>

                    <div class="name-info">

                        <div class="name">
                            ${escapeHTML(name)}
                        </div>

                        <div class="country">
                            ${label}
                        </div>

                    </div>

                </div>

                <button
                    class="copy-btn"
                    type="button">

                    Copy

                </button>

            `;


            const copyButton =
                card.querySelector(".copy-btn");


            copyButton.addEventListener(
                "click",
                ()=>{
                    copyName(
                        copyButton,
                        name
                    );
                }
            );


            container.appendChild(card);

        }
    );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================================
   COPY
===================================================== */

function copyName(button,name){

    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
            .writeText(name)
            .then(
                ()=>showCopied(button)
            )
            .catch(
                ()=>fallbackCopy(
                    button,
                    name
                )
            );

    }
    else{

        fallbackCopy(
            button,
            name
        );

    }

}


/* =====================================================
   FALLBACK COPY
===================================================== */

function fallbackCopy(button,name){

    const textarea =
        document.createElement("textarea");

    textarea.value = name;

    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);

    textarea.select();


    try{

        document.execCommand("copy");

        showCopied(button);

    }
    catch(error){

        button.textContent = "Select";

    }


    document.body.removeChild(textarea);

}


/* =====================================================
   COPIED
===================================================== */

function showCopied(button){

    button.textContent = "✓ Copied";

    button.classList.add("copied");


    setTimeout(
        ()=>{
            button.textContent = "Copy";
            button.classList.remove("copied");
        },
        1200
    );

}


/* =====================================================
   DARK / BRIGHT
===================================================== */

function toggleTheme(){

    document.body.classList.toggle("dark");


    const isDark =
        document.body.classList.contains("dark");


    const button =
        document.getElementById("themeBtn");


    if(isDark){

        button.textContent =
            "☀️ Bright Mode";

        localStorage.setItem(
            "theme",
            "dark"
        );

    }
    else{

        button.textContent =
            "🌙 Dark Mode";

        localStorage.setItem(
            "theme",
            "bright"
        );

    }

}


/* =====================================================
   LOAD SAVED THEME
===================================================== */

if(
    localStorage.getItem("theme") === "dark"
){

    document.body.classList.add("dark");

    document.getElementById("themeBtn")
        .textContent =
        "☀️ Bright Mode";

}


/* =====================================================
   COUNTRY CHANGE
===================================================== */

document
    .getElementById("country")
    .addEventListener(
        "change",
        generateNames
    );


/* =====================================================
   START
===================================================== */

generateNames();

</script>

</body>
</html>
